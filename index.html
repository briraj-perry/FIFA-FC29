    <script>
      // Gracefully ignore Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('@vite/client')
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || e.filename || '')) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
